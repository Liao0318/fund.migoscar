<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="main-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1c1e" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a1c1e" flood-opacity="0.10" />
    </filter>

    <filter id="coin-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <filter id="heart-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#EA4335" flood-opacity="0.25" />
    </filter>

    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F0EAE1" />
    </linearGradient>

    <linearGradient id="googleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="40%" stop-color="#357ABD" />
      <stop offset="100%" stop-color="#245A94" />
    </linearGradient>

    <linearGradient id="coupleHeart" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6584" />
      <stop offset="100%" stop-color="#E02447" />
    </linearGradient>

    <linearGradient id="coupleHeartBack" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#B8D5FC" />
      <stop offset="100%" stop-color="#7DAAF5" />
    </linearGradient>

    <linearGradient id="googleCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#E69500" />
    </linearGradient>

    <linearGradient id="coinRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="100%" stop-color="#E59900" />
    </linearGradient>
  </defs>

  <!-- 背景圓角底圖 (填滿整張圖示 512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGlow)" />

  <!-- 1. 記帳系統主卡片 -->
  <g filter="url(#main-shadow)">
    <rect x="38" y="92" width="436" height="328" rx="44" fill="url(#googleBlue)" />
    <line x1="80" y1="146" x2="280" y2="146" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.45" />
    <rect x="88" y="270" width="46" height="96" rx="23" fill="#FFFFFF" opacity="0.35" />
    <rect x="160" y="215" width="46" height="151" rx="23" fill="#34A853" />
    <rect x="232" y="175" width="46" height="191" rx="23" fill="#FFFFFF" />
    <rect x="304" y="240" width="46" height="126" rx="23" fill="#A8C7FA" opacity="0.75" />
  </g>

  <!-- 2. 情侶雙心 -->
  <g filter="url(#heart-shadow)">
    <path
      d="M 370 120 C 370 70, 310 50, 280 95 C 250 50, 190 70, 190 120 C 190 180, 280 230, 280 230 C 280 230, 370 180, 370 120 Z" 
      fill="url(#coupleHeartBack)"
      opacity="0.95"
      transform="rotate(-16 280 130) scale(0.92)"
    />
    <path
      d="M 425 140 C 425 85, 365 65, 335 112 C 305 65, 245 85, 245 140 C 245 205, 335 258, 335 258 C 335 258, 425 205, 425 140 Z" 
      fill="url(#coupleHeart)"
    />
  </g>

  <!-- 3. 公積金金幣 -->
  <g filter="url(#coin-shadow)">
    <circle cx="390" cy="370" r="92" fill="url(#googleCoin)" />
    <circle cx="390" cy="370" r="76" fill="none" stroke="url(#coinRing)" stroke-width="6" opacity="0.9" />
    <text
      x="390"
      y="404" 
      font-family="system-ui, -apple-system, sans-serif" 
      font-size="92" 
      font-weight="900" 
      fill="#FFFFFF" 
      text-anchor="middle"
    >
      ＄
    </text>
  </g>

  <!-- 4. Google 經典星芒與亮點 -->
  <path d="M 72 56 L 78 72 L 94 78 L 78 84 L 72 100 L 66 84 L 50 78 L 66 72 Z" fill="#EA4335" />
  <circle cx="456" cy="64" r="14" fill="#4285F4" />
  <circle cx="46" cy="442" r="12" fill="#34A853" />
  <path d="M 464 240 L 468 250 L 478 254 L 468 258 L 464 268 L 460 258 L 450 254 L 460 250 Z" fill="#FBBC04" />
</svg>
